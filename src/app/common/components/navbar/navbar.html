<mat-drawer-container class="h-screen">
  <mat-drawer-content>
    <nav class="flex items-center justify-between px-8 py-4">
      <div class="flex items-center gap-4">
        <button
          mat-icon-button
          class="!w-11 !h-11 !rounded-xl transition-colors hover:!bg-[var(--accent)]/10"
          (click)="isOpen.set(!isOpen())">
          <mat-icon class="!text-[var(--accent)]">{{ isOpen() ? 'close' : 'chat' }}</mat-icon>
        </button>
        <span class="text-xl font-semibold text-[var(--accent)] tracking-tight">Something AI</span>
      </div>
    </nav>
  </mat-drawer-content>

  <mat-drawer position="end" [opened]="isOpen()" mode="over" class="drawer">
    <button
      mat-icon-button
      class="!absolute !bottom-8 !left-0 !-translate-x-full !w-11 !h-11 !rounded-none !rounded-l-md !bg-[var(--accent)] hover:!bg-[var(--accent-dark)] transition-colors duration-200"
      (click)="isOpen.set(false)">
      <mat-icon class="!text-white">close</mat-icon>
    </button>
    <app-chat-interface/>
  </mat-drawer>
</mat-drawer-container>

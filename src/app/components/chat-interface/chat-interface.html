<div class="flex flex-col h-full bg-[var(--bg-secondary)]">
  <header
    class="px-6 py-5 border-b border-[var(--border)] bg-gradient-to-b from-[var(--bg-tertiary)] to-[var(--bg-secondary)]">
    <h2 class="text-base font-semibold text-[var(--text-primary)] tracking-tight">Chat</h2>
  </header>

  <main class="flex-1 overflow-y-auto p-6 flex flex-col gap-4">
    @if (messages().length === 0) {
    <div class="flex-1 flex flex-col items-center justify-center gap-3 p-8 text-center">
      <p class="text-xl font-semibold text-[var(--text-primary)]">Test</p>
      <button
        class="pt-4 px-5 py-3 bg-[var(--bg-card)] border border-[var(--border)] rounded-xl text-[var(--text-secondary)] text-sm cursor-pointer transition-all hover:border-[var(--accent)] hover:text-[var(--text-primary)] hover:bg-[var(--accent)]/10"
        (click)="sendMessage(suggestion)">
        {{ suggestion }}
      </button>
    </div>
    }

    @for (message of messages(); track message.id) {
      <app-data-chart [message]="message" />
    }

    @if (isLoading$ | async) {
    <div class="flex py-2">
      <mat-spinner class="!w-6 !h-6"></mat-spinner>
    </div>
    }
  </main>

  <footer class="px-6 py-4 pb-6 bg-gradient-to-t from-[var(--bg-tertiary)] to-[var(--bg-secondary)]">
    <div
      class="flex items-center gap-3 pl-4 pr-2 py-2 bg-[var(--bg-card)] border border-[var(--border)] rounded-3xl transition-all focus-within:border-[var(--accent)]">
      <input type="text" [formControl]="userInput" (keydown)="handleKeyPress($event)" placeholder="Type a message..."
        class="flex-1 border-none bg-transparent outline-none text-[var(--text-primary)] text-[0.9375rem] placeholder:text-[var(--text-muted)]" />
      <button
        class="w-9 h-9 rounded-full border-none bg-[var(--accent)] text-white cursor-pointer flex items-center justify-center transition-all shrink-0 hover:enabled:bg-[var(--accent-dark)] hover:enabled:scale-105 disabled:opacity-30 disabled:cursor-not-allowed"
        (click)="sendMessage()" [disabled]="userInput.invalid">
        <mat-icon class="!text-lg !w-[18px] !h-[18px]">arrow_upward</mat-icon>
      </button>
    </div>
  </footer>
</div>

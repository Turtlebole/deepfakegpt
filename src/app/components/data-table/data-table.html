<table class="w-full text-sm">
  <thead>
    <tr>
      @for (column of table.columns; track column) {
        <th class="text-left">{{ column }}</th>
      }
    </tr>
  </thead>
  <tbody>
    @for (row of table.rows; track $index) {
      <tr>
        @for (cell of row; track $index) {
          <td>{{ cell }}</td>
        }
      </tr>
    }
  </tbody>
</table>
